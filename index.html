<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Farag | Dark Cinema Portfolio</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: var(--text-main);
        }
        header h1 span {
            color: var(--accent-color);
        }
        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .bio-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            border: 1px solid #222;
        }
        .bio-card h2 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .bio-card p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: #fff;
        }
        .btn-insta {
            background: linear-gradient(45deg, #405de6, #5b51db, #833ab4, #c13584, #fd1d1d, #fcaf45);
            color: #fff;
        }
        .btn-tiktok {
            background-color: #000;
            color: #fff;
            border: 1px solid #333;
        }
        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
        footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>أحمد <span>فرج</span></h1>
            <p>مصور سينمائي & مونتير فيديو | Dark Cinema Portfolio</p>
        </header>

        <section class="bio-card">
            <h2>أهلاً بك في عالمي البصري</h2>
            <p>أقوم بتحويل اللحظات والأفكار إلى قصص بصرية ومحتوى سينمائي استثنائي. تواصل معي لتنفيذ مشروعك القادم.</p>
            
            <div class="btn-group">
                <!-- زر الواتساب المباشر -->
                <a href="https://wa.me/201015130014" target="_blank" class="btn btn-whatsapp">تواصل عبر الواتساب</a>
                
                <!-- انستجرام -->
                <a href="https://www.instagram.com/ahmed_farag_s" target="_blank" class="btn btn-insta">انستجرام</a>
                
                <!-- تيك توك -->
                <a href="https://www.tiktok.com/@ahmad_farag1" target="_blank" class="btn btn-tiktok">تيك توك</a>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Ahmed Farag. All Rights Reserved.</p>
        </footer>
    </div>

</body>
</html>
